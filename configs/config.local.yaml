# k8s-mcp-server 本地调试配置（连接 Docker Desktop 内置 K8s / kind 集群）
# 用法：./bin/k8s-mcp-server -config configs/config.local.yaml
#
# 注意：这是**本地一次性集群**的调试配置，read_only_mode 已关闭以便测试变更链路。
# 生产/共享集群请使用 configs/config.yaml（默认只读）。

server:
  listen: ":8080"
  # 指向本机 kubeconfig（Docker Desktop: context = docker-desktop）；支持 ~ 展开
  kubeconfig: "~/.kube/config"
  auth_tokens:
    - token: "change-me-bearer-token"
      name: "local-dev"

permission:
  # 本地集群放开写能力，便于验证 restart/scale/patch 链路
  read_only_mode: false
  # 系统命名空间黑名单依然生效：任何变更操作都禁止
  namespace_blacklist:
    - kube-system
    - kube-public
    - kube-node-lease
    - local-path-storage
  mutation_allowed_kinds:
    - deployment
  # 本地常用仓库前缀（前缀匹配）
  image_whitelist:
    - docker.io
    - registry.k8s.io
    - ghcr.io
    - quay.io
    - kind-registry:5000
  scale_limit:
    max_replicas: 10
    min_replicas: 0
  log_limits:
    max_tail_lines: 1000
    max_bytes: 5242880   # 5MiB
  list_limit: 50

cache:
  # Informer 缓存：list/get 走本地缓存
  enable: true
  resync_hours: 2

rate_limit:
  enable: true
  qps: 5
  burst: 10

audit:
  enable: true
  storage: log
  # 相对路径基于启动工作目录；父目录会自动创建
  log_file: "logs/audit.jsonl"

approve:
  enable: false
